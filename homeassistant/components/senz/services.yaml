set_climate_timer:
  name: Set climate timer
  description: Set climate entities to hold for a set time.
  target:
    entity:
      integration: senz
      domain: climate
  fields:
    datetime:
      name: Date & Time
      description: UTC date & time.
      required: true
      example: '"2022-06-01 12:04:20"'
      selector:
        text:
    temperature:
      name: Temperature
      description: Temperature to set climate entity to
      required: false
      selector:
        number:
          min: 5
          max: 35
          step: 0.5
          unit_of_measurement: '°'
